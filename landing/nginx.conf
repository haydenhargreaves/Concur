server {
    listen 80;
    absolute_redirect off;  # keep https/host from the outer proxy on redirects

    # Landing page (this presentation), served from /usr/share/nginx/html/landing/
    location = /landing { return 301 /landing/; }
    location /landing/ {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Everything else goes to the Streamlit dashboard; needs websockets
    location / {
        proxy_pass http://dashboard:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
